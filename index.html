/* Palette and component geometry aligned with Metrology Workbench:

:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px;color-scheme:dark;--background:#0b1220;--glow:#142033;--surface:#131d2e;--chrome:#0e1726;--chrome-border:#1d2840;--text:#e4ecf7;--muted:#aeb8c7;--quiet:#97a4b7;--border:#243348;--icon-bg:#1c293c;--primary:#60a5fa;--button:#2563eb;--button-hover:#1d4ed8;--tab:#1c293c;--hover-border:#4d5869;--shadow:0 1px 2px #0006;--hover-shadow:0 10px 28px #0006;--input:#0e1726}
:root[data-theme="light"]{color-scheme:light;--background:#f5f7fb;--glow:#fff;--surface:#fff;--chrome:#eef1f6;--chrome-border:#dce2ea;--text:#1d2535;--muted:#5f6978;--quiet:#64748b;--border:#e3e8f0;--icon-bg:#eef2f8;--primary:#2563eb;--button:#2563eb;--button-hover:#1d4ed8;--tab:#eef2f8;--hover-border:#6b7685;--shadow:0 1px 2px #1018280f;--hover-shadow:0 10px 28px #1018281f;--input:#fff}
*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;min-width:280px;color:var(--text);background:radial-gradient(circle at 50% 0%,var(--glow) 0%,var(--background) 60%);min-height:100vh}button,input{font:inherit}button,a{-webkit-tap-highlight-color:transparent}button{cursor:pointer;border:0;background:none;color:inherit}a{color:inherit;text-decoration:none}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--primary);outline-offset:4px}svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}::selection{background:#2563eb;color:white}.skip{position:fixed;top:-100px;left:20px;padding:14px;background:var(--surface);color:var(--text);border:1px solid var(--primary);z-index:30}.skip:focus{top:10px}.wrap{max-width:1104px;padding:0 32px;margin:0 auto}header{background:var(--chrome);border-bottom:1px solid var(--chrome-border)}.header-inner{max-width:none;min-height:44px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:inline-flex;align-items:center;gap:9px;border-radius:5px}.brand-emblem{height:25px;width:25px;object-fit:contain}.brand-text{font-size:13px;letter-spacing:.02em;font-weight:600;color:var(--muted)}.brand-text span{margin-left:4px}.header-right{margin-left:auto;display:flex;align-items:center;gap:7px}.header-label{display:none}.help,.theme-toggle{display:flex;align-items:center;justify-content:center;gap:7px;min-height:32px;padding:0 10px;border-radius:7px;font-size:12px;color:var(--muted);transition:background .18s}.help:hover,.theme-toggle:hover{background:var(--icon-bg);color:var(--text)}.help svg,.theme-toggle svg{width:16px;height:16px}.theme-toggle{width:34px;padding:0}.header-divider{height:18px;border-left:1px solid var(--border);margin:0 4px}main.wrap{min-height:calc(100svh - 44px);display:flex;flex-direction:column;justify-content:center;padding-top:50px;padding-bottom:20px}.intro{display:flex;align-items:center;justify-content:center;gap:28px;padding:0 0 44px}.hero-emblem{position:relative;width:140px;height:140px;flex:0 0 auto;display:grid;place-items:center}.hero-emblem:before{content:"";position:absolute;inset:2%;border-radius:50%;background:radial-gradient(circle,#60a5fa29 0%,#60a5fa14 32%,transparent 60%);filter:blur(14px)}.hero-emblem img{position:relative;width:100%;height:100%;object-fit:contain;animation:emblem-settle 2s cubic-bezier(.2,.8,.2,1) both}.intro-heading{display:flex;flex-direction:column;gap:10px}.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--quiet);margin:0;font-weight:400}h1{font-size:clamp(2rem,4.4vw,3rem);line-height:1.1;letter-spacing:-.025em;font-weight:700;margin:0}.intro-description{font-size:16px;line-height:1.5;color:var(--muted);margin:0}.workspace{width:100%}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:0 0 18px;border-bottom:1px solid var(--border)}.tabs{display:flex;align-items:center;gap:5px}.tab{display:flex;align-items:center;gap:8px;padding:10px 13px;border-radius:8px;font-size:14px;color:var(--quiet);white-space:nowrap;transition:background .18s,color .18s}.tab:hover{background:var(--icon-bg);color:var(--text)}.tab[aria-pressed=true]{background:var(--tab);color:var(--text);font-weight:600}.tab svg{width:17px;height:17px}.count{border:1px solid var(--border);border-radius:5px;font-size:11px;min-width:20px;text-align:center;line-height:18px;padding:0 4px;color:var(--quiet)}.search{display:flex;align-items:center;gap:9px;padding:0 12px;background:var(--input);border:1px solid var(--border);border-radius:8px;height:41px;width:272px;color:var(--quiet)}.search:focus-within{border-color:var(--primary);outline:2px solid color-mix(in srgb,var(--primary) 22%,transparent);outline-offset:1px}.search>span{display:flex}.search input{border:0;outline:0;height:100%;width:100%;min-width:0;color:var(--text);font-size:14px;background:transparent}.search input:focus-visible{outline:0}.search input::placeholder{color:var(--quiet)}.search input::-webkit-search-cancel-button{display:none}.search svg{width:16px;height:16px}.search kbd{font:11px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding:2px 5px;border:1px solid var(--border);border-radius:4px;white-space:nowrap;color:var(--quiet)}.search button{display:grid;place-items:center;padding:0}.directory-heading{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:23px 0 15px}h2{font-size:14px;margin:0;font-weight:600;color:var(--text)}.directory-heading p{font-size:12px;color:var(--quiet);margin:0}.app-card{position:relative;padding:28px;display:flex;gap:20px;border:1px solid var(--border);background:var(--surface);border-radius:16px;box-shadow:var(--shadow);transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;animation:reveal .35s ease-out both}.app-card:hover{transform:translateY(-3px);border-color:var(--hover-border);box-shadow:var(--hover-shadow)}.application-icon{display:grid;place-items:center;flex:0 0 auto;width:54px;height:54px;border-radius:12px;background:var(--icon-bg);color:var(--quiet)}.application-icon svg{width:25px;height:25px}.app-content{min-width:0;width:100%}.app-top{display:flex;align-items:center;gap:12px;min-height:20px}.app-label{display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.08em;color:var(--quiet);text-transform:uppercase}.app-label svg{width:13px;height:13px}.favorite{display:grid;place-items:center;position:absolute;top:20px;right:20px;width:34px;height:34px;border-radius:8px;color:var(--quiet);border:1px solid transparent}.favorite:hover{background:var(--icon-bg);border-color:var(--border)}.favorite[aria-pressed=true]{color:var(--primary);background:var(--icon-bg)}.favorite[aria-pressed=true] svg{fill:color-mix(in srgb,var(--primary) 24%,transparent)}.favorite svg{width:18px;height:18px}.app-card h3{font-size:23px;letter-spacing:-.4px;line-height:1.2;font-weight:600;margin:5px 35px 9px 0}.app-description{font-size:15px;line-height:1.6;color:var(--muted);margin:0;max-width:570px}.under-card{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-top:15px;color:var(--quiet);font-size:12px}.under-card span{display:flex;align-items:center;gap:6px}.under-card svg{width:13px;height:13px}.empty{border:1px dashed var(--border);border-radius:16px;text-align:center;padding:46px 25px;background:var(--surface)}.empty>svg{width:25px;height:25px;color:var(--quiet);margin-bottom:12px}.empty h3{font-size:23px;font-weight:600;letter-spacing:-.5px;margin:0 0 12px}.empty p{font-size:15px;line-height:1.7;color:var(--muted);max-width:440px;margin:0 auto 24px}.reset{background:var(--button);color:white;border-radius:8px;padding:11px 17px;font-size:14px}.footer{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-top:42px;padding:20px 0 0;border-top:1px solid var(--border);color:var(--quiet);font-size:12px}.footer-brand{display:flex;align-items:center;gap:8px}.footer-brand strong{font-weight:500}.footer-emblem{height:21px;width:21px;object-fit:contain}.footer-right{display:flex;align-items:center;gap:7px}.footer-right svg{width:13px;height:13px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:40;max-width:90vw;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);box-shadow:var(--hover-shadow);padding:13px 20px;font-size:14px}.toast:empty{display:none}dialog{max-width:490px;width:calc(100% - 36px);padding:32px;border:1px solid var(--border);border-radius:16px;background:var(--surface);color:var(--text);box-shadow:var(--hover-shadow)}dialog::backdrop{background:#0009;backdrop-filter:blur(5px)}dialog h2{font-size:25px;margin:4px 25px 18px 0;letter-spacing:-.5px}dialog p{font-size:16px;line-height:1.7;color:var(--muted)}dialog .close{position:absolute;right:20px;top:22px;padding:5px;display:grid;place-items:center}dialog .done{margin-top:10px;float:right}@keyframes emblem-settle{from{opacity:0;transform:translateY(5px) rotateY(-9deg)}to{opacity:1;transform:translateY(0) rotateY(0)}}@keyframes reveal{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
.card-link::after{content:"";position:absolute;inset:0;border-radius:16px;z-index:1}.card-link:focus-visible{outline:none}.card-link:focus-visible::after{outline:2px solid var(--primary);outline-offset:4px}.favorite{z-index:2}.fallback-link{display:block;margin:15px 0;padding:20px;border:1px solid var(--border);border-radius:16px;background:var(--surface)}
.back-link{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:7px;color:var(--muted);transition:background .18s,color .18s}.back-link:hover{background:var(--icon-bg);color:var(--text)}.back-link svg{width:18px;height:18px}

/* Real application captures, embedded for single-file SharePoint hosting. */
.app-card{padding:14px;gap:28px;align-items:center}
.app-preview{flex:0 0 42%;aspect-ratio:8/5;overflow:hidden;border:1px solid var(--border);border-radius:10px;background:var(--background)}
.app-preview img{display:block;width:100%;height:100%;object-fit:cover;object-position:top;transition:transform .3s ease}
.app-preview[data-app="metbase"]{background:#0d0d0d}
:root[data-theme="light"] .app-preview[data-app="metbase"]{background:#f8f8f7}
.app-preview[data-app="metbase"] img{object-fit:contain;object-position:center}
.app-card:hover .app-preview[data-app="metbase"] img{transform:none}
.app-preview .preview-light{display:none}
:root[data-theme="light"] .app-preview .preview-dark{display:none}
:root[data-theme="light"] .app-preview .preview-light{display:block}
.app-card:hover .app-preview img{transform:scale(1.025)}
.app-content{padding:20px 24px 20px 0}
.app-top{min-height:10px}
.app-card h3{margin-right:8px}
@media(max-width:800px){.app-card{gap:22px}.app-preview{flex-basis:43%}.app-content{padding-right:14px}.app-card h3{font-size:21px}}
@media(max-width:620px){.app-card{padding:12px;display:block}.app-preview{width:100%;aspect-ratio:8/5}.app-content{padding:20px 10px 14px}.app-top{min-height:0}.app-card h3{padding-right:32px}.favorite{top:20px;right:20px;background:var(--surface);border-color:var(--border)}}
@media(prefers-reduced-motion:reduce){.app-preview img{transition:none}.app-card:hover .app-preview img{transform:none}}

.directory-actions{display:flex;align-items:center;gap:14px}.access-refresh{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:6px 9px;border:1px solid var(--border);border-radius:8px;color:var(--muted);font-size:12px}.access-refresh:hover{background:var(--icon-bg);color:var(--text)}.access-refresh:disabled{cursor:default;opacity:.55}.access-refresh svg{width:15px;height:15px}.access-note{margin:0 0 16px;padding:12px 15px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--muted);font-size:13px;line-height:1.5}.access-empty p:last-child{margin-bottom:0}@media(max-width:360px){.directory-actions{gap:8px}.access-refresh{padding:6px}.directory-heading{gap:8px}}

<script id="portal-audience">
window.MetcalAudience = (() => {
// This UI gate does not replace SharePoint page, asset, or list permissions.
// Keep the matching embedded helper in Metrology-Software-Homepage in sync.
const PORTAL_WEB = 'https://flankspeed.sharepoint-mil.us/sites/metsoft';
const PORTAL_GROUP = 'METCAL Users';

function hostingMode(win = window) {
  const hints = [];
  try { hints.push(win.location.href, win._spPageContextInfo?.webAbsoluteUrl); } catch {}
  try { hints.push(win.parent.location.href, win.parent._spPageContextInfo?.webAbsoluteUrl); } catch {}
  try { hints.push(win.document.referrer); } catch {}
  const urls = hints.flatMap(value => { try { return [new URL(value)]; } catch { return []; } });
  if (urls.some(url => url.origin === new URL(PORTAL_WEB).origin)) return 'sharepoint';
  const local = url => ['localhost', '127.0.0.1', '[::1]'].includes(url.hostname);
  if (urls.some(url => /^https?:$/.test(url.protocol) && !local(url))) return 'unavailable';
  return urls.some(url => url.protocol === 'file:' || /^https?:$/.test(url.protocol) && local(url)) ? 'preview' : 'unavailable';
}

async function readPortalAudience({ fetchImpl = fetch, timeoutMs = 15000 } = {}) {
  const controller = new AbortController();
  let timer;
  const read = async path => {
    const response = await fetchImpl(PORTAL_WEB + path, {
      method: 'GET', credentials: 'include', cache: 'no-store', redirect: 'error',
      headers: { Accept: 'application/json;odata=nometadata' }, signal: controller.signal,
    });
    if (!response.ok || response.redirected || !/\bapplication\/json\b/i.test(response.headers.get('content-type') || '')) throw new Error('Access could not be verified');
    const body = await response.json();
    return body?.d ?? body;
  };
  const pending = (async () => {
    try {
      const user = await read('/_api/web/currentuser?$select=Id,IsSiteAdmin');
      if (!Number.isSafeInteger(user?.Id) || user.Id <= 0 || typeof user.IsSiteAdmin !== 'boolean') return 'unknown';
      // Site collection administrators retain their intrinsic SharePoint access.
      if (user.IsSiteAdmin) return 'owner';
      const [groups, owners] = await Promise.all([
        read('/_api/web/currentuser/groups?$select=Id,Title&$top=5000'),
        read('/_api/web/associatedownergroup?$select=Id'),
      ]);
      const memberships = groups?.value ?? groups?.results;
      if (!Array.isArray(memberships) || groups['@odata.nextLink'] || groups['odata.nextLink'] || groups.__next ||
          !Number.isSafeInteger(owners?.Id) || owners.Id <= 0 ||
          memberships.some(group => !Number.isSafeInteger(group?.Id) || group.Id <= 0 || typeof group.Title !== 'string')) return 'unknown';
      if (memberships.some(group => group.Id === owners.Id)) return 'owner';
      return memberships.some(group => group.Title === PORTAL_GROUP) ? 'metcal' : 'other';
    } catch { return 'unknown'; }
  })();
  try {
    return await Promise.race([pending, new Promise(resolve => {
      timer = setTimeout(() => { controller.abort(); resolve('unknown'); }, timeoutMs);
    })]);
  } finally { clearTimeout(timer); }
}

function mayUsePortal(audience) {
  return audience === 'owner' || audience === 'metcal';
}

return { readPortalAudience };
})();
</script>
<script id="application-access">
'use strict';
// Directory visibility follows the signed-in user's page permissions. This
// never grants access; SharePoint must also secure every app's assets and data.
window.MetrologyAccess = (() => {
  const tenantOrigin = 'https://flankspeed.sharepoint-mil.us';
  const localHost = url => ['localhost', '127.0.0.1', '[::1]'].includes(url.hostname);
  function environment(win = window) {
    const hints = [];
    try { hints.push(win.location.href, win._spPageContextInfo?.webAbsoluteUrl); } catch {}
    try { hints.push(win.parent.location.href, win.parent._spPageContextInfo?.webAbsoluteUrl); } catch {}
    try { hints.push(win.document.referrer); } catch {}
    const urls = hints.flatMap(value => { try { return [new URL(value)]; } catch { return []; } });
    if (urls.some(url => url.origin === tenantOrigin)) return 'sharepoint';
    // Preview is a local development mode, never a fallback for a failed check.
    const remote = urls.some(url => /^https?:$/.test(url.protocol) && !localHost(url));
    if (!remote && urls.some(url => url.protocol === 'file:' || /^https?:$/.test(url.protocol) && localHost(url))) return 'preview';
    return 'unavailable';
  }
  function permissionUrl(appUrl) {
    const target = new URL(appUrl);
    if (target.origin !== tenantOrigin || target.username || target.password) throw new Error('Untrusted application address');
    const page = target.pathname.match(/^((?:\/(?:sites|teams)\/[^/]+)?)\/(?:SitePages|Pages)\/.+\.aspx$/i);
    if (!page) throw new Error('Use a published SharePoint application page');
    const path = encodeURIComponent(decodeURIComponent(target.pathname).replace(/'/g, "''"));
    return `${target.origin}${page[1]}/_api/web/GetFileByServerRelativePath(decodedurl='${path}')/ListItemAllFields/EffectiveBasePermissions`;
  }
  function permissionWord(value) {
    if (!(typeof value === 'string' && /^\d+$/.test(value)) && !(typeof value === 'number' && Number.isInteger(value))) throw new Error('Missing permission bits');
    const word = BigInt(value);
    if (word < 0n || word > 4294967295n) throw new Error('Invalid permission bits');
    return word;
  }
  function mayOpen(body) {
    const result = body?.d ?? body;
    const bits = result?.EffectiveBasePermissions ?? result;
    const low = permissionWord(bits?.Low);
    permissionWord(bits?.High);

const paths={grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',star:'<path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9Z"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',help:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 2-2.5 2-2.5 4m0 3h.01"/>',layers:'<path d="m12 3 9 5-9 5-9-5 9-5ZM3 12l9 5 9-5M3 16l9 5 9-5"/>',spark:'<path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5Z"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10h.01"/>',board:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16m6-16v16M6 8v4m6-4v7m6-7v3"/>',people:'<circle cx="9" cy="8" r="3"/><path d="M3 20v-2a6 6 0 0 1 12 0v2m1-15a3 3 0 0 1 0 6m3 9v-2a6 6 0 0 0-2-4"/>',chart:'<path d="M4 3v17h17M8 15v-4m5 4V7m5 8V4"/>',headset:'<path d="M4 14v-3a8 8 0 0 1 16 0v7a3 3 0 0 1-3 3h-5"/><rect x="3" y="11" width="4" height="7" rx="2"/><rect x="17" y="11" width="4" height="7" rx="2"/>',file:'<path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9Zm0 0v6h6M8 13h8m-8 4h5"/>',check:'<rect x="3" y="3" width="18" height="18" rx="5"/><path d="m7 12 3 3 7-7"/>',wallet:'<path d="M20 8V5a2 2 0 0 0-2-2L5 6a2 2 0 0 0-2 2v11a2 2 0 0 0 2 2h15V8H5"/><path d="M20 12h-5v5h5m-3-2.5h.01"/>',book:'<path d="M12 5v16M12 5C9 3 5 3 2 4v15c3-1 7-1 10 2 3-3 7-3 10-2V4c-3-1-7-1-10 1Z"/>',box:'<path d="m12 3 9 5v9l-9 5-9-5V8Zm0 10 9-5M12 13 3 8m9 5v9M7.5 5.5l9 5"/>',external:'<path d="M14 3h7v7m0-7L11 13M10 4H5a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2h13a2 2 0 0 0 2-2v-5"/>'};
const icon=name=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+(paths[name]||paths.grid)+'</svg>';
const esc=value=>String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
let storageAvailable=true;
function read(name){try{const v=JSON.parse(localStorage.getItem('metsoft-'+name)||'[]');return Array.isArray(v)?v.filter(id=>APPS.some(a=>a.id===id)):[]}catch{storageAvailable=false;return []}}
function save(name,value){try{localStorage.setItem('metsoft-'+name,JSON.stringify(value))}catch{storageAvailable=false}}
let favorites=new Set(read('favorites')),recent=read('recent'),view='all',timer;
document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=icon(el.dataset.icon));
document.querySelector('kbd').textContent=/Mac|iPhone|iPad/.test(navigator.platform)?'⌘ K':'Ctrl K';

const sun='<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>';
const moon='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.8 13.1A9 9 0 0 1 10.9 3.2a9 9 0 1 0 9.9 9.9Z"/></svg>';
function updateThemeControl(){const dark=document.documentElement.dataset.theme==='dark';const label='Switch to '+(dark?'light':'dark')+' theme';$('theme-toggle').innerHTML=dark?sun:moon;$('theme-toggle').setAttribute('aria-label',label);$('theme-toggle').title=label;document.querySelector('meta[name="theme-color"]').content=dark?'#0b1220':'#f5f7fb'}
$('theme-toggle').onclick=()=>{const next=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=next;try{localStorage.setItem('theme',next)}catch{}updateThemeControl()};
updateThemeControl();

let accessibleApps = [], accessState = 'loading', accessIncomplete = false, checking;
const accessEnvironment = MetrologyAccess.environment();

function emptyState(title, description, glyph = 'grid') {
  $('grid').innerHTML = `<div class="empty access-empty">${icon(glyph)}<h3>${esc(title)}</h3><p>${esc(description)}</p></div>`;
}
function render() {
  const query = $('search').value.trim().toLowerCase();
  $('clear').hidden = !query;
  document.querySelector('kbd').hidden = !!query;
  $('grid').setAttribute('aria-busy', String(accessState === 'loading'));
  $('refresh-access').disabled = accessState === 'loading';
  $('nav-count').textContent = accessState === 'loading' ? '…' : accessibleApps.length;
  $('access-note').hidden = true;
  $('under-card').hidden = true;
  if (accessState === 'loading') {
    $('result-count').textContent = 'Checking access…';
    $('results-announcement').textContent = 'Checking application access';
    emptyState('Loading your applications', 'Checking which applications are available to you.', 'clock');
    return;
  }
  if (accessEnvironment === 'preview') {
    $('access-note').hidden = false;
    $('access-note').textContent = 'Local preview · Application access is checked when hosted in SharePoint.';
    $('refresh-access').hidden = true;
  } else if (accessIncomplete && accessibleApps.length) {
    $('access-note').hidden = false;
    $('access-note').textContent = 'Some applications couldn’t be checked. Select Refresh to try again.';
  }
  if (!accessibleApps.length) {
    $('result-count').textContent = '0 applications';
    const unavailable = accessEnvironment === 'unavailable';
    const title = unavailable ? 'Open your workspace in SharePoint' : accessIncomplete ? 'We couldn’t load your applications' : 'No applications available';
    const description = unavailable ? 'Open this Home page from your organization’s SharePoint site to check application access.'
      : accessIncomplete ? 'Your application access could not be confirmed. Select Refresh to try again, or reopen this page in SharePoint.'
      : 'Ask a site owner to review your application access. After access is updated, select Refresh.';
    $('results-announcement').textContent = title;
    emptyState(title, description, 'info');
    return;
  }
  let apps = accessibleApps.filter(a => (view === 'all' || view === 'favorites' && favorites.has(a.id) || view === 'recent' && recent.includes(a.id)) && (!query || (a.name + ' ' + a.description).toLowerCase().includes(query)));
  if (view === 'recent') apps.sort((a, b) => recent.indexOf(a.id) - recent.indexOf(b.id));
  $('result-count').textContent = apps.length + ' ' + (apps.length === 1 ? 'application' : 'applications');
  $('results-announcement').textContent = apps.length + ' ' + (apps.length === 1 ? 'application' : 'applications') + ' shown';
  $('under-card').hidden = !apps.length;
  $('grid').innerHTML = apps.map((a, i) => `<article class="app-card" style="margin-bottom:${i < apps.length - 1 ? '20px' : '0'}"><div class="app-preview" data-app="${esc(a.id)}" aria-hidden="true"><img class="preview-dark" src="${THUMBNAILS[a.id].dark}" alt="" width="${THUMBNAILS[a.id].width || 1200}" height="${THUMBNAILS[a.id].darkHeight || 900}" decoding="async"><img class="preview-light" src="${THUMBNAILS[a.id].light}" alt="" width="${THUMBNAILS[a.id].width || 1200}" height="${THUMBNAILS[a.id].lightHeight || 900}" decoding="async"></div><div class="app-content"><div class="app-top"><span class="app-label"></span><button class="favorite" data-favorite="${esc(a.id)}" aria-label="${favorites.has(a.id) ? 'Remove' : 'Add'} ${esc(a.name)} ${favorites.has(a.id) ? 'from' : 'to'} favorites" aria-pressed="${favorites.has(a.id)}">${icon('star')}</button></div><h3><a class="card-link" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer" data-open="${esc(a.id)}" aria-label="Open ${esc(a.name)} in a new tab">${esc(a.name)}</a></h3><p class="app-description">${esc(a.description)}</p></div></article>`).join('');
  if (!apps.length) {
    const title = query ? 'No matching applications' : view === 'favorites' ? 'Keep your go-to app close.' : 'Ready when you are.';
    const description = query ? 'Try another app name or keyword, or clear your search.' : view === 'favorites' ? 'Select the star on any application to add it to your favorites.' : 'Applications you open from this workspace will appear here.';
    emptyState(title, description, view === 'favorites' ? 'star' : 'search');
    const reset = document.createElement('button');
    reset.className = 'reset'; reset.textContent = 'View all applications';
    reset.onclick = () => { $('search').value = ''; setView('all'); };
    $('grid').firstElementChild.append(reset);
  }
}
async function refreshAccess() {
  if (checking) return checking;
  accessibleApps = []; accessState = 'loading'; accessIncomplete = false;
  render();
  checking = (async () => {
    if (accessEnvironment === 'preview') accessibleApps = [...APPS];
    else if (accessEnvironment === 'sharepoint') {
      const states = await Promise.all(APPS.map(app => MetrologyAccess.checkApp(app)));
      accessibleApps = APPS.filter((app, index) => states[index] === 'allowed');
      accessIncomplete = states.includes('unknown');
    } else accessIncomplete = true;
    accessState = 'ready';
    render();
  })();
  try { await checking; } finally { checking = null; }
}
$('refresh-access').onclick = refreshAccess;
// Recheck after returning from another tab/app. Never persist permission results.
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && accessEnvironment === 'sharepoint') refreshAccess();
});

function setView(next){view=next;document.querySelectorAll('[data-view]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.view===view)));$('view-title').textContent={all:'Applications',favorites:'Your favorites',recent:'Recently opened'}[view];render()}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{$('search').value='';setView(b.dataset.view)});
$('search').addEventListener('input',render);$('clear').onclick=()=>{$('search').value='';render();$('search').focus()};
$('grid').onclick=e=>{const favorite=e.target.closest('[data-favorite]');if(favorite){const id=favorite.dataset.favorite;if(!accessibleApps.some(a=>a.id===id)){e.preventDefault();return}favorites.has(id)?favorites.delete(id):favorites.add(id);save('favorites',[...favorites]);render();const button=Array.from(document.querySelectorAll('[data-favorite]')).find(b=>b.dataset.favorite===id);(button||document.querySelector('[data-view="favorites"]')).focus();$('toast').textContent=(favorites.has(id)?'Added to favorites':'Removed from favorites')+(!storageAvailable?' · For this visit only':'');clearTimeout(timer);timer=setTimeout(()=>$('toast').textContent='',2400);return}const link=e.target.closest('[data-open]');if(link){if(!accessibleApps.some(a=>a.id===link.dataset.open)){e.preventDefault();return}recent=[link.dataset.open,...recent.filter(id=>id!==link.dataset.open)].slice(0,20);save('recent',recent)}};
$('grid').addEventListener('auxclick',e=>{const link=e.target.closest('[data-open]');if(e.button===1&&link){if(!accessibleApps.some(a=>a.id===link.dataset.open)){e.preventDefault();return}recent=[link.dataset.open,...recent.filter(id=>id!==link.dataset.open)].slice(0,20);save('recent',recent)}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('search').focus()}if(e.key==='Escape'&&document.activeElement===$('search')){$('search').value='';render()}});
refreshAccess();
</script>
</body>
</html>
